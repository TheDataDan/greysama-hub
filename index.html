<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv | Media Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Updated to dark gray gradient with a touch of purple and red hye */
            background: linear-gradient(135deg, #1c1c1c 0%, #2a2a2a 40%, #201a2f 70%, #2d1a1a 100%);
            background-attachment: fixed; /* Keeps gradient smooth on scroll */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .hub-wrapper {
            display: flex;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .player-card {
            background: rgba(30, 30, 30, 0.7); /* Translucent dark grey */
            border-radius: 12px;
            padding: 8px; /* Slimmer border area */
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06); /* Nearly invisible border */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 560px; /* Base size */
            height: 315px;
            overflow: hidden; /* Keeps things neat */
        }

        .player-card:hover {
            transform: translateY(-5px) scale(1.01); /* Subtle movement */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-color: rgba(255,255,255,0.15); /* Slightly brighter border */
        }

        iframe {
            width: 100%;
            height: 100%;
            border-radius: 8px; /* Rounded iframe */
            border: none;
        }

        @media (max-width: 1200px) {
            .player-card { width: 448px; height: 252px; } /* Slightly larger on smaller screens */
        }
        @media (max-width: 950px) {
            .hub-wrapper { flex-direction: column; align-items: center; }
            .player-card { width: 90%; max-width: 560px; height: 0; padding-bottom: 50.625%; /* 16:9 aspect ratio */ }
            iframe { position: absolute; top: 0; left: 0; }
        }
    </style>
</head>
<body>

    <div class="hub-wrapper">
        <div class="player-card">
            <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=UCxBVf-A_6bnjVHFLPOxFQ5w&autoplay=0" allowfullscreen></iframe>
        </div>

        <div class="player-card">
            <iframe src="https://player.twitch.tv/?channel=greysamatv&parent=greysama.live&parent=www.greysama.live&parent=greysama.tv&parent=www.greysama.tv&autoplay=false" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
