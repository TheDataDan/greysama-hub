<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv | Media Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="header">
        <h1>Follow <span class="brand-handle">GreysamaTV</span></h1>
        <div class="social-icons">
            <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
            <i class="fa-brands fa-twitch" style="color: #9146ff;"></i>
        </div>
    </div>

    <div class="hub-wrapper">
        <div class="player-card">
            <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=UCxBVf-A_6bnjVHFLPOxFQ5w" allowfullscreen></iframe>
        </div>

        <div class="player-card">
            <iframe src="https://player.twitch.tv/?channel=greysamatv&parent=greysama.live&parent=www.greysama.live&parent=greysama.tv&parent=www.greysama.tv&autoplay=false" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
