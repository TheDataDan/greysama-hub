<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv | Media Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Update this URL later for a custom background image */
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .hub-wrapper {
            display: flex;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
            width: 560px; /* Standard medium size */
            height: 315px;
        }

        .player-card:hover {
            transform: translateY(-10px);
            border-color: #6441a5; /* Twitch Purple glow */
        }

        iframe {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            border: none;
        }

        @media (max-width: 1200px) {
            .player-card { width: 400px; height: 225px; }
        }
    </style>
</head>
<body>

    <div class="hub-wrapper">
        <div class="player-card">
            <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=UCxBVf-A_6bnjVHFLPOxFQ5w" allowfullscreen></iframe>
        </div>

        <div class="player-card">
            <iframe src="https://player.twitch.tv/?channel=greysamatv&parent=greysama.live&parent=www.greysama.live&parent=greysama.tv&parent=www.greysama.tv&autoplay=false" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
