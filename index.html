<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv | Global Gameplay</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --silver: linear-gradient(90deg, #777 0%, #fff 50%, #777 100%);
            --yt-glow: rgba(255, 0, 0, 0.15);
            --tw-glow: rgba(169, 112, 255, 0.15);
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* INTRO OVERLAY */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }
        #intro-overlay.hide { transform: translateY(-100%); }

        /* LOGO & HEADER */
        header { margin-top: 50px; text-align: center; }
        .shimmer-text {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: var(--silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: 0.5s;
        }
        .shimmer-text:hover {
            animation: shimmer 1.5s infinite linear;
            transform: scale(1.05);
        }

        @keyframes shimmer { to { background-position: 200% center; } }

        /* THE HUB (SIDE-BY-SIDE DESKTOP, STACKED MOBILE) */
        .hub-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        .player-box {
            flex: 1;
            min-width: 340px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 15px;
            border: 1px solid #222;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .youtube-box { box-shadow: 0 0 30px var(--yt-glow); }
        .twitch-box { box-shadow: 0 0 30px var(--tw-glow); }

        .player-box:hover {
            transform: translateY(-5px);
            border-color: #444;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* SOCIAL ICONS */
        .social-row { margin-top: 15px; display: flex; gap: 20px; font-size: 1.5rem; }
        .icon-red { color: #ff0000; }
        .icon-purple { color: #9146ff; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            header { margin-top: 30px; }
            .shimmer-text { font-size: 1.8rem; }
            .hub-container { flex-direction: column; align-items: center; }
            .player-box { width: 100%; min-width: unset; }
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h1 class="shimmer-text">SAMA</h1>
    </div>

    <header>
        <div class="shimmer-text">GREYSAMA.TV</div>
        <div class="social-row">
            <span class="icon-red">●</span>
            <span class="icon-purple">●</span>
        </div>
    </header>

    <div class="hub-container">
        <div class="player-box youtube-box">
            <iframe src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID" allowfullscreen></iframe>
        </div>

        <div class="player-box twitch-box">
            <iframe src="https://player.twitch.tv/?channel=YOUR_TWITCH_NAME&parent=greysama.tv" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Intro Animation Trigger
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('intro-overlay').classList.add('hide');
            }, 1800);
        });
    </script>
</body>
</html>
