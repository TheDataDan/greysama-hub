<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv | Media Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ROCKSTAR SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease-out;
        }

        .splash-logo {
            position: relative;
            font-size: 4rem;
            font-weight: 900;
            color: #1a1a1a; /* Base dark color */
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .splash-logo::after {
            content: "SAMA";
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            color: #fff;
            /* The Rockstar "Blade of Light" */
            clip-path: polygon(-20% 0%, 5% 0%, -5% 100%, -30% 100%);
            animation: rockstarSweep 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #fff);
        }

        @keyframes rockstarSweep {
            0% { clip-path: polygon(-20% 0%, 5% 0%, -5% 100%, -30% 100%); }
            100% { clip-path: polygon(100% 0%, 130% 0%, 120% 100%, 90% 100%); }
        }

        .splash-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- MAIN SITE STYLES --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d; 
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(100, 65, 165, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(255, 0, 0, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
            opacity: 0; /* Starts hidden for the fade-in */
            transform: translateY(10px);
            transition: all 1.5s ease;
        }

        .header.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* SILVER SHIMMER LOGO */
        .brand-handle {
            background: linear-gradient(90deg, #777 0%, #fff 50%, #777 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .social-icons {
            margin-top: 15px;
            display: flex;
            gap: 25px;
            justify-content: center;
            font-size: 1.8rem;
        }

        .social-icons a {
            text-decoration: none;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .social-icons a:hover { transform: scale(1.2); }

        .hub-wrapper {
            display: flex;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .player-card {
            background: rgba(20, 20, 20, 0.7);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            width: 560px;
            height: 315px;
        }

        .player-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        iframe {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            border: none;
        }

        @media (max-width: 1200px) {
            .player-card { width: 90%; max-width: 500px; height: 280px; }
        }

        @media (max-width: 600px) {
            .player-card { height: 210px; }
            .splash-logo { font-size: 2.5rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">SAMA</div>
    </div>

    <div class="header" id="main-header">
        <h1 style="color: #888; font-weight: 300; letter-spacing: 2px; font-size: 1.2rem;">
            Follow <span class="brand-handle">GreysamaTV</span>
        </h1>
        <div class="social-icons">
            <a href="https://www.youtube.com/@GreysamaTV" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
            </a>
            <a href="https://www.twitch.tv/greysamatv" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-twitch" style="color: #9146ff;"></i>
            </a>
        </div>
    </div>

    <div class="hub-wrapper">
        <div class="player-card">
            <iframe src="https://www.youtube.com/embed/vmzqNeHUGZw?start=4" allowfullscreen></iframe>
        </div>

        <div class="player-card">
            <iframe src="https://player.twitch.tv/?channel=greysamatv&parent=greysama.live&parent=greysama.tv&autoplay=false" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            const header = document.getElementById('main-header');

            // 1. Show Splash for 2.2 seconds
            setTimeout(() => {
                splash.classList.add('splash-hidden');
                
                // 2. Fade in the main site content
                setTimeout(() => {
                    header.classList.add('visible');
                }, 400); 

            }, 2200);
        });
    </script>

</body>
</html>
