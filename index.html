<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: row; height: 100vh; width: 100vw; }
        .pane { flex: 1; position: relative; border: 1px solid #222; }
        iframe { width: 100%; height: 100%; border: none; }
        @media (max-width: 768px) { .wrapper { flex-direction: column; overflow-y: auto; } .pane { height: 50vh; } }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="pane">
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCxBVf-A_6bnjVHFLPOxFQ5w&autoplay=1&mute=1"></iframe>
        </div>
        <div class="pane">
            <iframe src="https://player.twitch.tv/?channel=greysamatv&parent=greysama.tv&parent=www.greysama.tv&autoplay=true&muted=true"></iframe>
        </div>
    </div>
</body>
</html>
