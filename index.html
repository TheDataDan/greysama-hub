<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv</title>
</head>
<body>

<div id="intro-overlay">
    <h1 class="shimmer-logo">SAMA</h1>
</div>

<div class="main-container">
    <header>
        <h1 class="shimmer-logo" id="main-logo">GREYSAMA.TV</h1>
    </header>

    <div id="video-stage" class="stage-yt"> <div id="yt-player" class="player-wrapper active">
            <iframe src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="twitch-player" class="player-wrapper">
             <iframe src="https://player.twitch.tv/?channel=YOUR_TWITCH_NAME&parent=greysama.tv" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <div class="toggle-container">
        <button onclick="switchMode('yt')" id="btn-yt" class="toggle-btn active">🔴 YOUTUBE</button>
        <button onclick="switchMode('twitch')" id="btn-twitch" class="toggle-btn">🟣 TWITCH</button>
    </div>
</div>

</body>
</html>
