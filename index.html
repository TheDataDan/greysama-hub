<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greysama.tv | Media Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d; 
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(100, 65, 165, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(255, 0, 0, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
            animation: fadeIn 1.5s ease-in;
        }

        .header h1 {
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 1.2rem;
            color: #888;
        }

        .brand-handle {
            color: #fff;
            font-weight: 600;
        }

        .social-icons {
            margin-top: 10px;
            display: flex;
            gap: 25px;
            justify-content: center;
            font-size: 1.8rem;
        }

        .social-icons a {
            text-decoration: none;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .social-icons a:hover {
            transform: scale(1.2);
        }

        .hub-wrapper {
            display: flex;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .player-card {
            background: rgba(20, 20, 20, 0.7);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            width: 560px;
            height: 315px;
        }

        .player-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        iframe {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            border: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1200px) {
            .player-card { width: 90%; max-width: 500px; height: 280px; }
            .hub-wrapper { gap: 20px; }
        }

        @media (max-width: 600px) {
            .player-card { height: 210px; }
            .header h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Follow <span class="brand-handle">GreysamaTV</span></h1>
        <div class="social-icons">
            <a href="https://www.youtube.com/@GreysamaTV" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
            </a>
            <a href="https://www.twitch.tv/greysamatv" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-twitch" style="color: #9146ff;"></i>
            </a>
        </div>
    </div>

    <div class="hub-wrapper">
        <div class="player-card">
            <iframe src="https://www.youtube.com/embed?listType=user_uploads&list=UCxBVf-A_6bnjVHFLPOxFQ5w" allowfullscreen></iframe>
        </div>

        <div class="player-card">
            <iframe src="https://player.twitch.tv/?channel=greysamatv&parent=greysama.live&parent=www.greysama.live&parent=greysama.tv&parent=www.greysama.tv&autoplay=false" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
